# SQL Server for the demo — in-cluster, single replica, one PVC on kind's
# default StorageClass (local-path). The SA password below is a DEMO
# placeholder for a throwaway local cluster; anything shared uses a real
# secret store instead of a literal Secret.
apiVersion: v1
kind: Secret
metadata:
  name: mssql-secret
  namespace: simplcommerce
type: Opaque
stringData:
  SA_PASSWORD: "Ch@ngeMe_Demo123!" # DEMO ONLY — local throwaway cluster
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mssql-data
  namespace: simplcommerce
spec:
  accessModes: ["ReadWriteOnce"]
  # no storageClassName → kind's default (rancher local-path) provisions it
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql
  namespace: simplcommerce
spec:
  replicas: 1
  selector:
    matchLabels: { app: mssql }
  strategy:
    type: Recreate # single RWO volume — never run two pods against it
  template:
    metadata:
      labels: { app: mssql }
    spec:
      securityContext:
        fsGroup: 10001 # mssql image runs as uid 10001; let it own the volume
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: mssql-secret, key: SA_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { memory: "2Gi" }
          readinessProbe:
            tcpSocket: { port: 1433 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mssql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: simplcommerce
spec:
  selector: { app: mssql }
  ports:
    - port: 1433
      targetPort: 1433
