# Lab 7 - free, local, OpenAI-compatible LLM inside the kind cluster (no API key, no data leaves the laptop).
# Ollama serves http://ollama:11434/v1 (chat completions). setup-ollama.sh applies this and pulls a small model.
# No app=simplcommerce label, so the k8s-agents-operator does not touch this pod.
apiVersion: apps/v1
kind: Deployment
metadata: { name: ollama, namespace: simplcommerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: ollama } }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports: [{ containerPort: 11434 }]
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0" }
            - { name: OLLAMA_KEEP_ALIVE, value: "24h" }     # keep the model loaded between calls
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
          volumeMounts: [{ name: models, mountPath: /root/.ollama }]
          readinessProbe: { httpGet: { path: /api/tags, port: 11434 }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { memory: "3Gi" }                        # qwen2.5:0.5b needs ~1 GB; leave room for the 1.5b variant
      volumes:
        - name: models
          emptyDir: {}                                       # models are re-pulled if the pod is recreated (setup-ollama.sh is idempotent)
---
apiVersion: v1
kind: Service
metadata: { name: ollama, namespace: simplcommerce }
spec:
  selector: { app: ollama }
  ports: [{ port: 11434, targetPort: 11434 }]
